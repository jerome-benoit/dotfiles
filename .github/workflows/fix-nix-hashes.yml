name: Fix Nix Hashes

on:
  pull_request:
    branches: [main]
    paths:
      - "home-manager/modules/development/pins/pi.json"
      - "home-manager/modules/development/pins/omp.json"
      - "home-manager/modules/development/pins/prime-agent.json"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  fix-hashes:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            extra-experimental-features = nix-command flakes

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Fix Nix hashes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/fix-nix-hashes.sh update "origin/$BASE_REF"
