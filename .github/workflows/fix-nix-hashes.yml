name: Fix Nix Hashes

on:
  pull_request:
    branches: [main]
    paths:
      - "home-manager/modules/development/pins/caveman.json"
      - "home-manager/modules/development/pins/omp.json"
      - "home-manager/modules/development/pins/prime-agent.json"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  fix-hashes:
    if: startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          github_access_token: ""
          nix_conf: |
            extra-experimental-features = nix-command flakes

      - name: Fix Nix hashes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash scripts/fix-nix-hashes.sh update "origin/$BASE_REF"

      - name: Push Nix hash fix
        env:
          PUSH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash scripts/fix-nix-hashes.sh push "$GITHUB_REPOSITORY" "$HEAD_REF"
